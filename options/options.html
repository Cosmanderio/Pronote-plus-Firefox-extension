<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres de Pronote++</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Paramètres de Pronote++</h1>
    <p id="intro">Attention : toutes les modifications apportées par cette extension sont purement graphiques et locales</p>
    <div id="buttons">
        <input type="file" id="image-input" accept="image/*" style="display: none;">
        <button id="edit-pfp">Changer sa photo de profil</button>
        <button id="edit-name">Changer son nom</button>
        <div id="added-points">
            <p>Augmenter sa moyenne générale de :</p>
            <input type="number" step="0.1" value="0">
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
